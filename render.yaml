# Render Blueprint for the API, frontend, and managed PostgreSQL database.

services:
  - type: web
    name: mindlink-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDirectory: server
    buildCommand: npm install --include=dev && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: APP_URL
        value: https://mindlink-thesis-1.onrender.com
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://mindlink-thesis-1.onrender.com,https://mindlink-web.onrender.com

  - type: web
    name: mindlink-web
    runtime: static
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mindlink-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mindlink-db
    plan: free
    region: oregon
    databaseName: mindlink
    user: mindlink
